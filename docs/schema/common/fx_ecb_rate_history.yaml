name: "fx_ecb_rate_history"
kind: "table"
access: "read"
category: "Exchange rates"
description: "European Central Bank foreign-exchange reference rates, append-only: one row per (currency, frequency, period). Rates are EUR-pivot — value is the number of units of the currency per 1 EUR — and EUR itself never has a row."
primaryKey:
  - "unit"
  - "timeFormat"
  - "period"
columns: |
  name	type
  unit	CHAR(3)
  timeFormat	TEXT
  period	TEXT
  createdAt	TIMESTAMPTZ
  updatedAt	TIMESTAMPTZ
  value	DOUBLE PRECISION
  decimals	INTEGER
