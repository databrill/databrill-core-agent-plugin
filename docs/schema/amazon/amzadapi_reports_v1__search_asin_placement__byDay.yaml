  addToCartPromoted	INTEGER
  brandedSearches	INTEGER
  brandedSearchesFromClicks	INTEGER
  brandedSearchesFromViews	INTEGER
  totalCost	DOUBLE PRECISION
  sales	DOUBLE PRECISION
  salesFromClicks	DOUBLE PRECISION
  salesFromViews	DOUBLE PRECISION
