  salesFromViewsPromoted	DOUBLE PRECISION
  salesHalo	DOUBLE PRECISION
  salesFromClicksHalo	DOUBLE PRECISION
  salesFromViewsHalo	DOUBLE PRECISION
  newToBrandSales	DOUBLE PRECISION
  newToBrandSalesFromClicks	DOUBLE PRECISION
  newToBrandSalesFromViews	DOUBLE PRECISION
  newToBrandSalesPromoted	DOUBLE PRECISION
  newToBrandSalesHalo	DOUBLE PRECISION
indexes:
  - name: "amzadapi_reports_v1__search_asin_placement__byDay__date_plus"
    columns:
      - "date"
      - "merchantId"
      - "marketplaceId"
      - "campaignId"
    include:
      - "impressions"
      - "totalCost"
