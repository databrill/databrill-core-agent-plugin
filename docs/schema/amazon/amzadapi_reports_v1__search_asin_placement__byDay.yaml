name: "amzadapi_reports_v1__search_asin_placement__byDay"
kind: "table"
access: "read"
category: "Amazon Ads API"
description: "Daily Amazon Ads search-term and placement report: one row per day, ad entity, target, search term and placement, with impressions, clicks, cost, purchases, units sold and sales."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "date"
  - "adProduct"
  - "campaignId"
  - "adGroupId"
  - "adId"
  - "advertisedProductId"
  - "targetMatchType"
  - "target"
  - "searchTerm"
  - "placementClassification"
columns: |
  name	type
  merchantId	TEXT
  marketplaceId	TEXT
  date	DATE
  adProduct	TEXT
  campaignId	TEXT
  adGroupId	TEXT
  adId	TEXT
  advertisedProductId	TEXT
  advertisedProductSku	TEXT
  targetMatchType	TEXT
  target	TEXT
  searchTerm	TEXT
  placementClassification	TEXT
  budgetCurrency	TEXT
  impressions	INTEGER
  clicks	INTEGER
  viewableImpressions	INTEGER
  purchases	INTEGER
  purchasesFromClicks	INTEGER
  purchasesFromViews	INTEGER
  purchasesPromoted	INTEGER
  purchasesFromClicksPromoted	INTEGER
  purchasesFromViewsPromoted	INTEGER
  purchasesHalo	INTEGER
  purchasesFromClicksHalo	INTEGER
  purchasesFromViewsHalo	INTEGER
  unitsSold	INTEGER
  unitsSoldFromClicks	INTEGER
  unitsSoldFromViews	INTEGER
  unitsSoldPromoted	INTEGER
  unitsSoldFromClicksPromoted	INTEGER
  unitsSoldFromViewsPromoted	INTEGER
  unitsSoldHalo	INTEGER
  unitsSoldFromClicksHalo	INTEGER
  unitsSoldFromViewsHalo	INTEGER
  newToBrandPurchases	INTEGER
  newToBrandPurchasesFromClicks	INTEGER
  newToBrandPurchasesFromViews	INTEGER
  newToBrandPurchasesPromoted	INTEGER
  newToBrandPurchasesHalo	INTEGER
  newToBrandUnitsSold	INTEGER
  newToBrandUnitsSoldFromClicks	INTEGER
  newToBrandUnitsSoldFromViews	INTEGER
  newToBrandUnitsSoldPromoted	INTEGER
  newToBrandUnitsSoldHalo	INTEGER
  detailPageViews	INTEGER
  detailPageViewsFromClicks	INTEGER
