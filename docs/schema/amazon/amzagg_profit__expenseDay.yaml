name: "amzagg_profit__expenseDay"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Account-level Amazon charges per store and posting day: the settlement rows the P&L counts as expenses, which are not order or refund rows, not the reserve, not advertising and not reimbursement reversals or clawbacks. Negative amounts only, summed per charge type and shipment."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "currency"
  - "datePosted"
  - "transactionType"
  - "amountType"
  - "amountDescription"
  - "shipmentId"
columns: |
  name	type	description
  merchantId	TEXT	Amazon Seller ID that was charged
  marketplaceId	TEXT	The marketplace the settlement row's marketplace name maps to, when it maps to exactly one; the empty string otherwise.
  currency	TEXT	The settlement's currency, the currency of amount
  datePosted	DATE	YYYY-MM-DD: the local day of the settlement row's posted time in the merchant's booking time zone, the zone amzagg_profit__orderItem.dateBooked uses.
  transactionType	TEXT	The settlement row's transaction type, never Order or Refund
  amountType	TEXT	The settlement row's amount type; the empty string when it has none
  amountDescription	TEXT	The settlement row's amount description; the empty string when it has none
  shipmentId	TEXT	The settlement row's shipment id; the empty string when it has none. An inbound shipment's charges carry its shipment id: FBA... for an FBA shipment, STAR-... for an AWD one.
  amount	DOUBLE PRECISION	Sum of the settlement rows' amounts, negative: a charge
  rowCount	INTEGER	Settlement rows summed into this row
