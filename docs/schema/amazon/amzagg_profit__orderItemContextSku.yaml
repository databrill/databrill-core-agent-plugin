name: "amzagg_profit__orderItemContextSku"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Per-SKU context of the P&L order-item fast path: fee-preview fields and the listing title, written by the order-item recalculation from its own calculation, only the rows that changed."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "sku"
columns: |
  name	type	nullable	description
  merchantId	TEXT		Amazon Seller ID
  marketplaceId	TEXT		Marketplace of the SKU
  sku	TEXT		Seller SKU
  asin	TEXT	true	The asin the title was resolved for; a line with another asin resolves its own
  title	TEXT	true	The title an order-item row of this SKU and asin carries; null when none is known
  hasEstimate	BOOLEAN		False when the fee preview has no row for the SKU (no estimate, not a zero one)
  referralRate	DOUBLE PRECISION	true	Referral fee as a fraction of net revenue, from the fee preview; null when no price backs it out
  referralPerUnit	DOUBLE PRECISION		Referral fee per unit at the fee preview's price, the fallback to the rate
  perUnit	DOUBLE PRECISION		Fulfilment and variable closing fee per unit, from the fee preview
  perOrder	DOUBLE PRECISION		Order handling fee per order, from the fee preview
