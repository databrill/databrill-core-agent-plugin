name: "amzspstream_FEED_PROCESSING_FINISHED"
kind: "table"
access: "read"
category: "Amazon notifications"
description: "Append-only landing table for Amazon FEED_PROCESSING_FINISHED notifications, one row per message, carrying the feed id, feed type and processing status. Re-delivering the same notification is a no-op."
primaryKey:
  - "id"
columns: |
  name	type	description
  id	TEXT	Deterministic UUIDv7 = generateDeterministicUuidV7(eventTime, notificationId) (primary key)
  eventTime	TIMESTAMPTZ	Notification eventTime
  merchantId	TEXT	Seller id from feedProcessingFinishedNotification.sellerId
  feedId	TEXT	Feed id from feedProcessingFinishedNotification.feedId
  feedType	TEXT	Feed type from feedProcessingFinishedNotification.feedType
  processingStatus	TEXT	Processing status from feedProcessingFinishedNotification.processingStatus
  receivedAt	TIMESTAMPTZ	When the consumer processed the message
  notificationVersion	TEXT	SP-API notificationVersion from the envelope
  payloadVersion	TEXT	SP-API payloadVersion from the envelope
  payload	JSONB	Unwrapped feedProcessingFinishedNotification with sellerId/feedId/feedType/processingStatus stripped (JSONB)
