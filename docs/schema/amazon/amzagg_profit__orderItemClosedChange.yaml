name: "amzagg_profit__orderItemClosedChange"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Record of source changes that reach closed P&L order-item history (rows booked before the open period): per merchant, source kind, date range and SKU, when it was seen, how many rows and how much gross profit it moves, and when it was repaired."
primaryKey:
  - "merchantId"
  - "sourceKind"
  - "dateFirst"
  - "dateLast"
  - "sku"
columns: |
  name	type	nullable	description
  merchantId	TEXT		Amazon Seller ID whose closed rows may differ
  sourceKind	TEXT		The kind of source change that reaches these dates; returnCredit: returns whose sale line's cost a repair changed; unknown: a difference only the monthly comparison found.
  dateFirst	DATE		First booked day the change may alter, YYYY-MM-DD
  dateLast	DATE		Last booked day the change may alter, inclusive, YYYY-MM-DD
  sku	TEXT		The SKU the change is limited to; the empty string when it names none
  foundBy	TEXT		flag: a source writer's change or the recalculation's own upkeep recorded it; monthlyCheck: only the nightly comparison of a closed month found it.
  firstSeenAt	TIMESTAMPTZ		When the entry was first recorded
  lastSeenAt	TIMESTAMPTZ		When the entry was last recorded again
  seenCount	INTEGER		How many times the entry was recorded
  rowsDiffering	INTEGER	true	Order-item rows of the entry's dates that differ from a fresh calculation, title-only differences excluded; null until priced.
  moneyAbs	DOUBLE PRECISION	true	Sum of the absolute change of gross profit of those rows, in each row's currency; null until priced
  moneySigned	DOUBLE PRECISION	true	Sum of the signed change of gross profit of those rows; null until priced
  pricedAt	TIMESTAMPTZ	true	When the nightly run last priced the entry; null when not priced since last seen
  repairedAt	TIMESTAMPTZ	true	When the repair last rewrote the entry's dates; null when not repaired since last seen
