name: "amzadapi_reports_v1__product01__byDay"
kind: "table"
access: "read"
category: "Amazon Ads API"
description: "Daily Amazon Ads product-attribution report: one row per day, ad entity and converted-product dimension, showing which advertised products led to purchases of which converted products. Promoted metrics count the advertised product itself; halo metrics count other products bought after the ad."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "date"
  - "adProduct"
  - "campaignId"
  - "adGroupId"
  - "adId"
  - "advertisedProductId"
  - "advertisedProductSku"
  - "convertedProductId"
  - "convertedProductMarketplace"
  - "productRelevance"
columns: |
  name	type
  merchantId	TEXT
  marketplaceId	TEXT
  date	DATE
  adProduct	TEXT
  campaignId	TEXT
  adGroupId	TEXT
  adId	TEXT
  advertisedProductId	TEXT
  advertisedProductSku	TEXT
  convertedProductId	TEXT
  convertedProductMarketplace	TEXT
  productRelevance	TEXT
  campaignCountry	TEXT
  budgetCurrency	TEXT
  convertedProductParentProductId	TEXT
  purchases	INTEGER
