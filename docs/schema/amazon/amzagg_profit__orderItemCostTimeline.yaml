name: "amzagg_profit__orderItemCostTimeline"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Landed unit cost of each SKU as intervals of days, as the P&L order-item recalculation resolved its UNIT_COGS attributes; the fast path costs each sale line at its own day from it."
primaryKey:
  - "merchantId"
  - "country"
  - "sku"
  - "asin"
  - "dateFirst"
columns: |
  name	type	nullable	description
  merchantId	TEXT		Amazon Seller ID
  country	TEXT		Uppercase country code of the marketplace the cost applies in
  sku	TEXT		Seller SKU
  asin	TEXT		The asin the cost was resolved for; the empty string when unknown
  dateFirst	DATE		First day the cost applies, YYYY-MM-DD
  dateLast	DATE	true	Last day the cost applies, inclusive, YYYY-MM-DD; null while it is open
  unitCost	DOUBLE PRECISION		Landed cost of one unit, in costCurrency
  costCurrency	TEXT	true	Currency of unitCost; null means the marketplace's own currency
