name: "amzagg_profit__orderItemSurchargeDay"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Fee-surcharge rate per marketplace and day, measured from the merchant's settled orders of the 90 days ending on that day; the rate the P&L order-item rows of that day are estimated with."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "dateBooked"
columns: |
  name	type	description
  merchantId	TEXT	Amazon Seller ID
  marketplaceId	TEXT	Marketplace the rate was measured in
  dateBooked	DATE	The day whose sale lines take this rate, YYYY-MM-DD
  surchargeRate	DOUBLE PRECISION	Surcharge as a fraction of the fees it is levied on, over the settled orders of the 90 days ending on the day; 0 where none is charged.
