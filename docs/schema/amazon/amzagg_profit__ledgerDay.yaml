name: "amzagg_profit__ledgerDay"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Per-store and per-day dashboard summary of the accrual ledger and the open order lines: the amount, units and contributing rows of each dashboard line, by the day the dashboard shows them (the order date for a sale, its cost of goods, an open order line and an order's shipping label; the 15th of the booked month for a long-term storage charge, including its paid-tax lines; every day of the month it pays for, for a monthly storage charge, including its paid-tax lines; the booked day otherwise)."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "currency"
  - "dateDashboard"
  - "line"
  - "source"
  - "flag"
columns: |
  name	type	description
  merchantId	TEXT	Amazon Seller ID
  marketplaceId	TEXT	Marketplace of the contributing transaction or open order line; the empty string when the transaction names none
  currency	TEXT	Currency of the contributing transaction or open order line; an open order line that states none takes its marketplace's default currency
  dateDashboard	DATE	The day the dashboard shows the amount on, YYYY-MM-DD: the order day of a sale, a title transfer, the cost of goods of either, an open order line and an order's shipping label (LabmanLabelPurchase, LabmanLabelChargeBack or LabmanLabelRefund); the 15th of the booked month for a long-term storage charge (FBALongTermStorageBilling), including its paid-tax lines; every day of the month it pays for, its booked month minus one, for a monthly storage charge (FBAStorageBilling), including its paid-tax lines, and each elapsed day of an open month for that month's storage estimate; the booked day otherwise, a return label among them, and for a sale none of whose sale lines has an order day or an order's shipping label whose order has none
  line	TEXT	The dashboard line (revenue, promoItem, promoShipping, amazonFees, amazonFeesEstimated, refunds, inbound, storage, shipping, taxNotRecoveredFees, cogs, cogsReplacements, cogsReturnLoss, cogsReturnLossReversal, cogsWarehouseLoss, cogsWarehouseLossReversal, returnCogsCredit, reimbursementCogsCredit, replacementCogsCredit, adCost, taxNotRecoveredAdvertising, accountExpenses, reimbursements, unclassified, taxPaidNotConfigured, taxPaidJurisdictionUnknown, taxPaidRecoverable, taxCollectedPaidOut, feeVatNotEstimated, storageNotEstimated, orders), followed by a colon and the child for the lines that have one: revenue (sale, titleTransfer or openOrderLine for those kinds; otherwise the income name and transaction kind, such as RecommerceLiquidation:removalShipment, RecommerceLiquidation:ledgerAdjustment or MiscAdjustment:ledgerAdjustment; a bare Sales account uses Sales:<kind>; the sale lines' units carry none), cogs (openOrderLine for an open order line's estimated cost of goods; the booked cost carries none), amazonFees (the fee's name and the transaction's kind), refunds (the transaction's kind and the account below its root), inbound, storage and shipping (the Finances `description`; storage also has the child estimate, an open month's estimate of its monthly storage charge, deleted when the charge books), adCost (the account below Advertising), accountExpenses (the account below its root), reimbursements (the account below Reimbursements, ending in the Finances `description`), unclassified (the account below Unclassified, or the account without its scope when no rule places it), taxNotRecoveredAdvertising, taxPaidNotConfigured, taxPaidJurisdictionUnknown and taxPaidRecoverable (where the tax was paid from: advertisingInvoice for an advertising invoice's tax and VAT credit, advertising for an advertising payment's tax taken from the Amazon balance, fees for every other; taxPaidRecoverable has only advertising and fees), and taxCollectedPaidOut (the account below Tax:Collected: the ship-to country and VAT rate, such as DE:VAT-19 or DE:VAT-Unknown, the country alone, such as US, or ShipCountryUnknown). shipping holds the labels the seller buys, Buy Shipping for orders and return labels, inside gross profit. A restock, a unit put back into stock, is on a line by the account it credits: returnCogsCredit for a sellable customer return and reimbursementCogsCredit for an in-kind reimbursement unit, both crediting cost of goods, and replacementCogsCredit for a replacement unit; the three make the statement's Returned to stock, inside gross profit. cogsReturnLossReversal and cogsWarehouseLossReversal hold a unit that reverses a return loss or a warehouse loss, each shown under its loss line, so cogsReplacements, cogsReturnLoss and cogsWarehouseLoss hold no restock. taxNotRecoveredFees and taxNotRecoveredAdvertising hold the tax Amazon charged on fees and on advertising that the seller's tax entity does not recover; taxPaidNotConfigured holds the tax Amazon charged a merchant in no tax entity, taxPaidJurisdictionUnknown the tax of a merchant in a tax entity whose country the ledger could not establish; neither counts in profit. taxPaidRecoverable, labelled 'Tax paid, recoverable', holds the tax Amazon deducted from the seller's balance that the seller's tax entity recovers; the recoverable tax of an advertising invoice, paid by card or bank transfer, is on no line. taxCollectedPaidOut, labelled 'Tax collected, paid out', holds the tax collected on sales that Amazon paid out to the seller to remit: the net of each Finances document's collected tax, so 0 where Amazon withholds the tax as deemed supplier or marketplace facilitator. Both are outside profit: each is money that moves the seller's Amazon balance without being income or cost. The VAT a seller self-assesses under the reverse charge is on no line. An open order line's estimated VAT on its estimated fee is on taxNotRecoveredFees, taxPaidRecoverable (child fees) or taxPaidNotConfigured (child fees) as its tax entity would place the booked tax, with source openOrderLine, which tells the estimate apart from the booked tax; feeVatNotEstimated carries only units: those of open order lines whose fee VAT is not estimated in full. An open month's estimated VAT on storage is on the lines the last charge's tax took, with source storageEstimate. storageNotEstimated carries only units, one per store and day with stock and no charge to estimate storage from, and is on this table only
  source	TEXT	ledger for ledger postings and sale lines dated by their rule, openOrderLine for the unshipped units of the open order lines, ledgerNoOrderDate for a sale none of whose sale lines has an order day, its cost of goods, and an order's shipping label whose order has no order day, dated by its booked day, storageEstimate for an open month's estimate of its monthly storage charge and its tax, which holds no ledger posting, and for the storageNotEstimated line
  flag	TEXT	The contributing transaction's beancount flag: * for a booked fact, ! for a provisional booking; open order lines, orders and the rows of source storageEstimate are *
  amount	DOUBLE PRECISION	The line's money, minus the sum of the mapped postings, plus the open order lines' own amounts: signed as the line contributes to profit, and on taxPaidRecoverable and taxCollectedPaidOut, which are outside profit, as they move the seller's Amazon balance, negative for tax Amazon deducted and positive for tax it paid out; an open month's estimate on the rows of source storageEstimate, signed alike; 0 on the orders, feeVatNotEstimated and storageNotEstimated lines
  units	INTEGER	Units: on revenue the sale lines' and open order lines' units; on cogs, cogsReturnLoss and returnCogsCredit the units the unit-cost postings cost, and on cogs also the units of open order lines with an estimated cost of goods; on feeVatNotEstimated the units of open order lines whose fee VAT is not estimated in full; on storageNotEstimated one per store day with stock and no charge to estimate storage from; on orders the orders counted, each once on the earliest day of its sale lines and open order lines; 0 elsewhere
  rowCount	INTEGER	The postings, sale lines, open order lines and orders summed into the row, a posting spread over a month counting once on each of its days, and 1 on a row of source storageEstimate; a row is deleted when it reaches 0
indexes:
  - name: "amzagg_profit__ledgerDay__merchantId__dateDashboard"
    columns:
      - "merchantId"
      - "dateDashboard"
  - name: "amzagg_profit__ledgerDay__storeStorageEstimates"
    columns:
      - "merchantId"
      - "marketplaceId"
      - "currency"
      - "dateDashboard"
    where: "\"source\" = 'storageEstimate'"
