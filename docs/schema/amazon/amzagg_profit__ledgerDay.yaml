name: "amzagg_profit__ledgerDay"
kind: "table"
access: "read"
category: "Amazon finances and profit"
description: "Per-store and per-day dashboard summary of the accrual ledger and the open order lines: the amount, units and contributing rows of each dashboard line, by the day the dashboard shows them (the order date for a sale, its cost of goods and an open order line, the booked day otherwise)."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "currency"
  - "dateDashboard"
  - "line"
  - "source"
  - "flag"
columns: |
  name	type	description
  merchantId	TEXT	Amazon Seller ID
  marketplaceId	TEXT	Marketplace of the contributing transaction or open order line; the empty string when the transaction names none
  currency	TEXT	Currency of the contributing transaction or open order line; an open order line that states none takes its marketplace's default currency
  dateDashboard	DATE	The day the dashboard shows the amount on, YYYY-MM-DD: the order day of a sale, a title transfer, the cost of goods of either and an open order line; the booked day otherwise, and for a sale none of whose sale lines has an order day
  line	TEXT	The dashboard line (revenue, promoItem, promoShipping, amazonFees, amazonFeesEstimated, refunds, inbound, storage, taxNotRecoveredFees, cogs, cogsReplacements, cogsReturnLoss, cogsReturnLossReversal, cogsWarehouseLoss, cogsWarehouseLossReversal, returnCogsCredit, reimbursementCogsCredit, replacementCogsCredit, adCost, taxNotRecoveredAdvertising, accountExpenses, reimbursements, unclassified, taxPaidNotConfigured, taxPaidJurisdictionUnknown, taxPaidRecoverable, taxCollectedPaidOut, feeVatNotEstimated, orders), followed by a colon and the child for the lines that have one: revenue (the transaction's kind, such as sale or titleTransfer, or openOrderLine for an open order line; the sale lines' units carry none), cogs (openOrderLine for an open order line's estimated cost of goods; the booked cost carries none), amazonFees (the fee's name and the transaction's kind), refunds (the transaction's kind and the account below its root), inbound and storage (the Finances `description`), adCost (the account below Advertising), accountExpenses (the account below its root), reimbursements (the account below Reimbursements, ending in the Finances `description`), unclassified (the account below Unclassified, or the account without its scope when no rule places it), taxNotRecoveredAdvertising, taxPaidNotConfigured, taxPaidJurisdictionUnknown and taxPaidRecoverable (where the tax was paid from: advertisingInvoice for an advertising invoice's tax and VAT credit, advertising for an advertising payment's tax taken from the Amazon balance, fees for every other; taxPaidRecoverable has only advertising and fees), and taxCollectedPaidOut (the account below Tax:Collected: the ship-to country and VAT rate, such as DE:VAT-19 or DE:VAT-Unknown, the country alone, such as US, or ShipCountryUnknown). A restock, a unit put back into stock, is on a line by the account it credits: returnCogsCredit for a sellable customer return and reimbursementCogsCredit for an in-kind reimbursement unit, both crediting cost of goods, and replacementCogsCredit for a replacement unit; the three make the statement's Returned to stock, inside gross profit. cogsReturnLossReversal and cogsWarehouseLossReversal hold a unit that reverses a return loss or a warehouse loss, each shown under its loss line, so cogsReplacements, cogsReturnLoss and cogsWarehouseLoss hold no restock. taxNotRecoveredFees and taxNotRecoveredAdvertising hold the tax Amazon charged on fees and on advertising that the seller's tax entity does not recover; taxPaidNotConfigured holds the tax Amazon charged a merchant in no tax entity, taxPaidJurisdictionUnknown the tax of a merchant in a tax entity whose country the ledger could not establish; neither counts in profit. taxPaidRecoverable, labelled 'Tax paid, recoverable', holds the tax Amazon deducted from the seller's balance that the seller's tax entity recovers; the recoverable tax of an advertising invoice, paid by card or bank transfer, is on no line. taxCollectedPaidOut, labelled 'Tax collected, paid out', holds the tax collected on sales that Amazon paid out to the seller to remit: the net of each Finances document's collected tax, so 0 where Amazon withholds the tax as deemed supplier or marketplace facilitator. Both are outside profit: each is money that moves the seller's Amazon balance without being income or cost. The VAT a seller self-assesses under the reverse charge is on no line. An open order line's estimated VAT on its estimated fee is on taxNotRecoveredFees, taxPaidRecoverable (child fees) or taxPaidNotConfigured (child fees) as its tax entity would place the booked tax, with source openOrderLine, which tells the estimate apart from the booked tax; feeVatNotEstimated carries only units: those of open order lines whose fee VAT is not estimated in full
  source	TEXT	ledger for ledger postings and sale lines dated by their rule, openOrderLine for the unshipped units of the open order lines, ledgerNoOrderDate for a sale none of whose sale lines has an order day, and its cost of goods, dated by its booked day
  flag	TEXT	The contributing transaction's beancount flag: * for a booked fact, ! for a provisional booking; open order lines and orders are *
  amount	DOUBLE PRECISION	The line's money, minus the sum of the mapped postings, plus the open order lines' own amounts: signed as the line contributes to profit, and on taxPaidRecoverable and taxCollectedPaidOut, which are outside profit, as they move the seller's Amazon balance, negative for tax Amazon deducted and positive for tax it paid out; 0 on the orders line
  units	INTEGER	Units: on revenue the sale lines' and open order lines' units; on cogs, cogsReturnLoss and returnCogsCredit the units the unit-cost postings cost, and on cogs also the units of open order lines with an estimated cost of goods; on feeVatNotEstimated the units of open order lines whose fee VAT is not estimated in full; on orders the orders counted, each once on the earliest day of its sale lines and open order lines; 0 elsewhere
  rowCount	INTEGER	The postings, sale lines, open order lines and orders summed into the row; a row is deleted when it reaches 0
indexes:
  - name: "amzagg_profit__ledgerDay__merchantId__dateDashboard"
    columns:
      - "merchantId"
      - "dateDashboard"
