name: "amazon_ads_target"
kind: "view"
access: "read"
category: "Curated views"
description: "Merged live view of Amazon advertising targets: the periodic Export table (amzadapi_exports_v1__target) reconciled with the near-realtime Amazon Marketing Stream snapshot (amzms_v1__targets), on the same merge semantics as amazon_ads_campaign. `target_details`, `target_level` and `bid` are Export-only; the stream nests its targeting expression inside the row's `doc` instead."
columns: |
  name	type	description
  merchant_id	TEXT
  marketplace_id	TEXT
  target_id	TEXT
  ad_group_id	TEXT
  campaign_id	TEXT
  ad_product	TEXT
  state	TEXT	Fresher of Export/stream state (ENABLED/PAUSED)
  negative	BOOLEAN
  target_type	TEXT
  target_level	TEXT	Export-only target level
  target_details	JSONB	Export-only target details incl. resolved fields (JSONB)
  bid	NUMERIC	Export-only bid
  delivery_status	TEXT	Export-only serving status
  delivery_reasons	JSONB	Export-only delivery reasons (JSONB)
  creation_date_time	TIMESTAMPTZ
  last_updated_date_time	TIMESTAMPTZ	Newest lastUpdatedDateTime across Export and stream
  export_last_updated_date_time	TIMESTAMPTZ
  stream_last_updated_date_time	TIMESTAMPTZ
  stream_version	NUMERIC	Latest stream snapshot version (null: no stream row)
definition: |
  SELECT
    COALESCE(e."merchantId", s."advertiser_id") AS merchant_id,
    COALESCE(e."marketplaceId", s."marketplace_id") AS marketplace_id,
    COALESCE(e."targetId", s."targetId") AS target_id,
    COALESCE(e."adGroupId", s."adGroupId") AS ad_group_id,
    COALESCE(e."campaignId", s."campaignId") AS campaign_id,
    COALESCE(e."adProduct", s."adProduct") AS ad_product,
    CASE WHEN s."lastUpdatedDateTime" > COALESCE(e."lastUpdatedDateTime", '-infinity')
      THEN s."state" ELSE e."state" END AS state,
    COALESCE(e."negative", s."negative") AS negative,
    COALESCE(e."targetType", s."targetType") AS target_type,
    e."targetLevel" AS target_level,
    e."targetDetails" AS target_details,
    e."bid" AS bid,
    e."deliveryStatus" AS delivery_status,
    e."deliveryReasons" AS delivery_reasons,
    COALESCE(e."creationDateTime", s."creationDateTime") AS creation_date_time,
    GREATEST(e."lastUpdatedDateTime", s."lastUpdatedDateTime") AS last_updated_date_time,
    e."lastUpdatedDateTime" AS export_last_updated_date_time,
    s."lastUpdatedDateTime" AS stream_last_updated_date_time,
    s."version" AS stream_version
  FROM "amzadapi_exports_v1__target" e
  FULL OUTER JOIN "amzms_v1__targets" s
    ON e."merchantId" = s."advertiser_id"
    AND e."marketplaceId" = s."marketplace_id"
    AND e."targetId" = s."targetId"
