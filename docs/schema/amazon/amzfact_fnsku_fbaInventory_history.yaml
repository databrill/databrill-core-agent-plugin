name: "amzfact_fnsku_fbaInventory_history"
kind: "table"
access: "read"
category: "Amazon inventory and offers"
description: "Per-day FBA inventory history at the physical grain: one row per (merchant, marketplace, FNSKU) and marketplace-local calendar date, with the lowest, highest, first and last fulfillable and buyable future-supply quantities among the changes recorded that day. A row exists only for a day on which the FNSKU's row in amzfact_fnsku_fbaInventory_latest changed, so a missing day means unchanged since the previous row. The value carried into a day is the previous row's Last, and the whole day's highest and lowest are GREATEST(Max, previous Last) and LEAST(Min, previous Last)."
primaryKey:
  - "merchantId"
  - "marketplaceId"
  - "fnsku"
  - "date"
columns: |
  name	type	nullable	description
  merchantId	TEXT		Amazon merchant (seller) id owning the units
  marketplaceId	TEXT		Marketplace the quantities were reported for; quantities are per marketplace
  fnsku	TEXT		Amazon fulfillment network SKU, which identifies the physical units. Equals the ASIN for commingled items.
  date	DATE		Calendar date, in the marketplace's own time zone, of the observations the row summarizes
  observedAtFirst	TIMESTAMPTZ		Earliest observation instant included in the row
  observedAtLast	TIMESTAMPTZ		Latest observation instant included in the row
  fulfillableMin	INTEGER	true	Lowest fulfillable quantity among the changes recorded on the day, which leaves out the value carried in from the previous row; null when no observation reported one
  fulfillableMax	INTEGER	true	Highest fulfillable quantity among the changes recorded on the day, which leaves out the value carried in from the previous row; null when no observation reported one
  fulfillableFirst	INTEGER	true	Fulfillable quantity at observedAtFirst, the day's first recorded change; the value at the start of the day is the previous row's fulfillableLast. Null when that observation did not report one
  fulfillableLast	INTEGER	true	Fulfillable quantity at observedAtLast; null when that observation did not report one
  futureSupplyBuyableMin	INTEGER	true	Lowest buyable future-supply quantity among the changes recorded on the day, which leaves out the value carried in from the previous row; null when no observation reported one
  futureSupplyBuyableMax	INTEGER	true	Highest buyable future-supply quantity among the changes recorded on the day, which leaves out the value carried in from the previous row; null when no observation reported one
  futureSupplyBuyableFirst	INTEGER	true	Buyable future-supply quantity at observedAtFirst, the day's first recorded change; the value at the start of the day is the previous row's futureSupplyBuyableLast. Null when that observation did not report one
  futureSupplyBuyableLast	INTEGER	true	Buyable future-supply quantity at observedAtLast; null when that observation did not report one
