name: "amzfact_fnsku_ledger_history"
kind: "table"
access: "read"
category: "Amazon inventory and offers"
description: "FBA inventory ledger facts at the physical grain: one row per (merchant, fulfillment center, FNSKU, disposition) and DAILY/FC summary day, restated from amzreport_LEDGER_SUMMARY. Sparse: an absent key on a day sat at zero; an absent day is a missing summary report. Country and region come from amazon_fulfillment_center."
primaryKey:
  - "merchantId"
  - "fulfillmentCenter"
  - "fnsku"
  - "disposition"
  - "date"
columns: |
  name	type	nullable	description
  merchantId	TEXT		Amazon merchant (seller) id owning the units
  fulfillmentCenter	TEXT		Amazon fulfillment-center code the units sat in, exactly as the ledger reports spell it
  fnsku	TEXT		Amazon fulfillment network SKU, which identifies the physical units
  disposition	TEXT		Ledger disposition such as SELLABLE or CUSTOMER_DAMAGED, exactly as reported
  date	DATE		Business day the row describes; sparse, not one row per day
  source	TEXT		SUMMARY when the row is a DAILY/FC ledger summary row, which is authoritative; DETAIL when it is estimated from detail events after the merchant's newest summary day
  startingWarehouseBalance	INTEGER		Units in the warehouse at the start of the day: the summary's own figure for SUMMARY, the key's newest summary ending balance carried through earlier estimate days for DETAIL, 0 when the summary has never listed the key
  endingWarehouseBalance	INTEGER		Starting balance plus every signed movement of the day
  netMovement	INTEGER		Signed sum of the day's movements as the source reports them; in-transit units are excluded
  inTransitBetweenWarehouses	INTEGER	true	Units in transit between centers, a separate state only the summary reports; null for DETAIL
  sourceRowCount	INTEGER		1 for SUMMARY; the number of detail events aggregated into the row for DETAIL
  anchorDate	DATE		Summary day the balances rest on: always the row's own day
indexes:
  - name: "amzfact_fnsku_ledger_history__merchantId__date"
    columns:
      - "merchantId"
      - "date"
