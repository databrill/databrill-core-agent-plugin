name: "amzspstream_ANY_OFFER_CHANGED"
kind: "table"
access: "read"
category: "Amazon notifications"
description: "Append-only landing table for Amazon ANY_OFFER_CHANGED notifications, one row per message, carrying the affected ASIN and the full notification in payload. Re-delivering the same notification is a no-op."
primaryKey:
  - "id"
columns: |
  name	type	description
  id	TEXT	Deterministic UUIDv7 = generateDeterministicUuidV7(eventTime, notificationId) (primary key)
  eventTime	TIMESTAMPTZ	Notification EventTime
  merchantId	TEXT	Seller id from AnyOfferChangedNotification.SellerId
  marketplaceId	TEXT	Marketplace id from OfferChangeTrigger.MarketplaceId
  asin	TEXT	ASIN from OfferChangeTrigger.ASIN
  receivedAt	TIMESTAMPTZ	When the consumer processed the message
  notificationVersion	TEXT	SP-API NotificationVersion from the envelope
  payloadVersion	TEXT	SP-API PayloadVersion from the envelope
  payload	JSONB	Unwrapped AnyOfferChangedNotification with SellerId stripped (JSONB)
