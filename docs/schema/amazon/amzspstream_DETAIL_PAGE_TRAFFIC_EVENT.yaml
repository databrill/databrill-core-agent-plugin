name: "amzspstream_DETAIL_PAGE_TRAFFIC_EVENT"
kind: "table"
access: "read"
category: "Amazon notifications"
description: "Append-only landing table for Amazon DETAIL_PAGE_TRAFFIC_EVENT notifications. One row per traffic-event element, so a single message fans out into several rows, each carrying glance views for one ASIN over one start-to-end window. Re-delivering the same notification is a no-op."
primaryKey:
  - "id"
columns: |
  name	type	description
  id	TEXT	Deterministic UUIDv7 keyed on (notificationId, marketplaceId, asin, startTime) (primary key)
  eventTime	TIMESTAMPTZ	Notification EventTime
  merchantId	TEXT	Merchant code parsed from the element accountId (amzn1.merchant.o.<merchantId>)
  marketplaceId	TEXT	Marketplace id from the traffic-event element
  asin	TEXT	ASIN from the traffic-event element
  startTime	TEXT	Start of the traffic-aggregation window (ISO-8601, also part of the PK discriminator)
  endTime	TEXT	End of the traffic-aggregation window (ISO-8601, also part of the PK discriminator)
  glanceViews	INTEGER	Glance views in the window for this asin/marketplace
  receivedAt	TIMESTAMPTZ	When the consumer processed the message
  notificationVersion	TEXT	SP-API NotificationVersion from the envelope
  payloadVersion	TEXT	SP-API PayloadVersion from the envelope
  payload	JSONB	Traffic-event element with promoted fields stripped (JSONB)
