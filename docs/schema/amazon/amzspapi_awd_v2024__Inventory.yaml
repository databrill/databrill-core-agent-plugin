name: "amzspapi_awd_v2024__Inventory"
kind: "table"
access: "read"
category: "Amazon inventory and offers"
description: "Amazon Warehousing and Distribution (AWD) on-hand inventory, one row per (merchantId, sku). Latest-only: each collection cycle overwrites the row and stamps capturedAt, so a SKU that has dropped out of the AWD listing is recognisable by a stale capturedAt. No history is kept."
primaryKey:
  - "merchantId"
  - "sku"
columns: |
  name	type	nullable	description
  merchantId	TEXT
  sku	TEXT
  totalOnhandQuantity	INTEGER		Total quantity present in AWD distribution centers
  totalInboundQuantity	INTEGER		Total quantity in transit from the seller, not yet received at AWD
  availableDistributableQuantity	INTEGER	true
  reservedDistributableQuantity	INTEGER	true
  replenishmentQuantity	INTEGER	true
  capturedAt	TIMESTAMPTZ		The listInventory cycle timestamp; stale rows have an old capturedAt
